<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作マニュアル</title>

<style>
body{
  font-family:sans-serif;
  padding:20px;
  max-width:800px;
  margin:auto;
  line-height:1.6;
}

h1{border-bottom:2px solid #333;}
h2{margin-top:30px;}
.box{
  background:#f5f5f5;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<h1>大分県柔道連盟　文書起案システム 操作マニュアル</h1>

<h2>① ログイン</h2>
<div class="box">
4桁のPINを入力してログインします。
</div>

<h2>② 起案（作成）</h2>
<div class="box">
・区分(支出/収入/稟議)を選択  
・整理番号を入力
・記載者氏名を入力
・必要に応じて項/目/節を入力
・件名、内容を入力
・必要に応じて金額/相手/方法を入力
・年月日を選択
・添付ファイルがあれば選択後、決定
・送信ボタン
</div>

<h2>③ 下書き</h2>
<div class="box">
下書き番号を入力して保存できます。</br>
途中で保存しておきたい場合は下書き番号をつけて保存
</div>

<h2>④ 承認</h2>
<div class="box">
承認者A・Bがそれぞれ承認します。
</div>

<h2>⑤ 決定</h2>
<div class="box">
管理者が決定ボタンを押します。
</div>

</body>
</html>
